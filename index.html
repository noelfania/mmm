<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マークダウンメモ帳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="login" class="login" hidden>
    <h1>マークダウンメモ帳</h1>
    <input id="login-password" type="password" placeholder="パスワード" aria-label="パスワード" autocomplete="current-password" required>
    <button type="submit">ログイン</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>

  <main id="app" class="app" hidden>
    <header class="topbar">
      <div id="tabs" class="tabs" role="tablist">
        <button id="karaoke-tab" class="tab karaoke-tab" type="button" role="tab" aria-selected="false">노래방</button>
        <button id="add-tab" class="add-tab" type="button" aria-label="新しいメモ" title="新しいメモ">+</button>
      </div>
      <div class="menu">
        <button id="open-password" type="button">パスワード変更</button>
        <button id="logout" type="button">ログアウト</button>
      </div>
    </header>

    <section id="karaoke" class="note karaoke" hidden>
      <div class="toolbar">
        <span id="karaoke-status" class="status" role="status"></span>
        <button id="karaoke-save" class="primary" type="button" title="Ctrl+S">保存</button>
        <button id="karaoke-edit" class="primary" type="button">編集</button>
      </div>
      <textarea id="karaoke-source" aria-label="歌の検索リスト" placeholder="歌手名と曲名を1行ずつ入力してください" spellcheck="false"></textarea>
      <div id="karaoke-links" class="karaoke-links" hidden></div>
    </section>

    <section id="note" class="note" hidden>
      <div class="toolbar">
        <span id="status" class="status" role="status"></span>
        <button id="save" class="primary" type="button" title="Ctrl+S">保存</button>
        <button id="edit" class="primary" type="button">編集</button>
        <button id="delete" class="danger" type="button">削除</button>
      </div>
      <div id="editor" class="editor">
        <textarea id="source" aria-label="マークダウン入力" placeholder="マークダウンを入力してください" spellcheck="false"></textarea>
        <div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="領域サイズの調整" tabindex="0"></div>
        <article id="preview" class="markdown"></article>
      </div>
      <article id="viewer" class="markdown viewer"></article>
    </section>
    <footer class="footer"><a href="https://github.com/noelfania/mmm" target="_blank" rel="noopener noreferrer">View on GitHub</a></footer>
  </main>

  <dialog id="password-dialog">
    <form id="password-form">
      <h2>パスワード変更</h2>
      <label>現在のパスワード
        <input id="current-password" type="password" autocomplete="current-password" required>
      </label>
      <label>新しいパスワード（4文字以上）
        <input id="new-password" type="password" minlength="4" autocomplete="new-password" required>
      </label>
      <label>新しいパスワード（確認）
        <input id="confirm-password" type="password" minlength="4" autocomplete="new-password" required>
      </label>
      <p id="password-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button id="password-cancel" type="button">キャンセル</button>
        <button class="primary" type="submit">変更</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
